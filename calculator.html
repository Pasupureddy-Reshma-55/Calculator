<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>

<body>
    <div id="all">
        <div>
            <h2>🔢Calculator</h2>
            <h5>Simple.Fast.Accurate.</h5>
        </div>
        <div>
            <button id="sun">☀</button>
            <button id="moon">⏾</button>
        </div>
        <div class="calculator">
            <input id="display" type="text" disabled>

            <div id="button">
                <button id="ac">AC</button>
                <button id="plus-mins">+/-</button>
                <button id="modulo">%</button>
                <button id="division">/</button>
                <br>


                <button id="seven">7</button>
                <button id="eight">8</button>
                <button id="nine">9</button>
                <button id="mul">*</button>
                <br>


                <button id="four">4</button>
                <button id="five">5</button>
                <button id="six">6</button>
                <button id="mins">-</button>
                <br>


                <button id="one">1</button>
                <button id="two">2</button>
                <button id="three">3</button>
                <button id="plus">+</button>
                <br>


                <button id="zero">0</button>
                <button id="dot">.</button>
                <button id="equall">=</button>
            </div>
        </div>
    </div>
    <h3>───── Calculate a better tomorrow ─────</h3>

</body>
<script src="calculator.js"></script>

</html>
